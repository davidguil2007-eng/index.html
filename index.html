<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Horse - Controle de Pontualidade</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #1a1a2e; --bg: #f4f7f6; --gray-status: #808080; --red-status: #e63946; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; }
        header { background: var(--primary); color: white; padding: 1.5rem; text-align: center; }
        .container { padding: 20px; max-width: 1200px; margin: auto; }
        
        /* Filtros */
        .filter-card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 12px; font-weight: bold; color: #555; }
        select, input { padding: 8px; border-radius: 6px; border: 1px solid #ccc; }
        button { padding: 9px 20px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* KPIs */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card p { margin: 5px 0 0; font-size: 28px; font-weight: bold; color: var(--primary); }

        /* Gráficos */
        .charts-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; margin-bottom: 20px; }
        .chart-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); min-height: 400px; }

        /* Tabela */
        .table-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; background: #eee; font-size: 13px; }
        td { padding: 10px; border-bottom: 1px solid #eee; font-size: 13px; }
        
        .badge { padding: 5px 10px; border-radius: 12px; color: white; font-weight: bold; font-size: 11px; text-transform: uppercase; }
        .bg-dentro { background: var(--gray-status); }
        .bg-fora { background: var(--red-status); }
        .bg-ignorar { background: #ddd; color: #777; }
    </style>
</head>
<body>

<header><h1>DASHBOARD DE PONTUALIDADE</h1></header>

<div class="container">
    <div class="filter-card">
        <div class="filter-group">
            <label>FORNECEDOR</label>
            <select id="fornSelect"><option value="ALL">TODOS</option></select>
        </div>
        <div class="filter-group">
            <label>DATA INÍCIO</label>
            <input type="date" id="dtStart">
        </div>
        <div class="filter-group">
            <label>DATA FIM</label>
            <input type="date" id="dtEnd">
        </div>
        <button onclick="processData()">ATUALIZAR FILTROS</button>
    </div>

    <div class="stats-grid">
        <div class="card"><h3>Total Analisado (Dentro + Fora)</h3><p id="kpiTotal">0</p></div>
        <div class="card"><h3>Eficiência Atual</h3><p id="kpiEficiencia">0%</p></div>
    </div>

    <div class="charts-grid">
        <div class="chart-container"><canvas id="barChart"></canvas></div>
        <div class="chart-container"><canvas id="pieChart"></canvas></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>DATA</th>
                    <th>FORNECEDOR</th>
                    <th>ROTA</th>
                    <th>VIAGEM</th>
                    <th>STATUS</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSet_MSL2I0uUFX4Fwa_0WSIJAeOiyRC5eS_kXFGn0JEJqPKaIKPSPghTlSM0suGCZ_hZD-e_ZM-NEW/pub?gid=0&single=true&output=csv';
    let rawData = [];
    let barChart, pieChart;

    async function init() {
        const res = await fetch(URL);
        const csv = await res.text();
        const rows = csv.split('\n').slice(1);
        
        rawData = rows.map(r => {
            const c = r.split(',');
            return {
                data: c[0]?.trim(),
                forn: c[3]?.replace(/"/g, '').trim(),
                rota: c[4]?.trim(),
                viagem: c[6]?.trim(),
                status: c[9]?.replace(/"/g, '').trim().toUpperCase()
            };
        });

        const forns = [...new Set(rawData.map(d => d.forn))].filter(f => f).sort();
        const select = document.getElementById('fornSelect');
        forns.forEach(f => select.innerHTML += `<option value="${f}">${f}</option>`);

        processData();
    }

    function processData() {
        const selForn = document.getElementById('fornSelect').value;
        const dStart = document.getElementById('dtStart').value;
        const dEnd = document.getElementById('dtEnd').value;

        let stats = { dentro: 0, fora: 0 };
        let barMap = {};
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";

        rawData.forEach(row => {
            // LÓGICA DO FILTRO DE DATA
            let matchDate = true;
            if (dStart && dEnd) {
                const parts = row.data.split('/'); // DD/MM/AAAA
                const dateObj = `${parts[2]}-${parts[1]}-${parts[0]}`; // AAAA-MM-DD
                matchDate = dateObj >= dStart && dateObj <= dEnd;
            }

            const matchForn = selForn === "ALL" || row.forn === selForn;

            if (matchDate && matchForn) {
                let badge = "bg-ignorar";
                
                // CONSIDERA APENAS DENTRO E FORA
                if (row.status.includes("DENTRO DO PRAZO") || row.status.includes("NO PRAZO")) {
                    stats.dentro++;
                    badge = "bg-dentro";
                } else if (row.status.includes("FORA DO PRAZO") || row.status.includes("ATRASADO")) {
                    stats.fora++;
                    badge = "bg-fora";
                }

                const key = selForn === "ALL" ? row.forn : row.data;
                barMap[key] = (barMap[key] || 0) + 1;

                tbody.innerHTML += `<tr>
                    <td>${row.data}</td>
                    <td>${row.forn}</td>
                    <td>${row.rota}</td>
                    <td>${row.viagem}</td>
                    <td><span class="badge ${badge}">${row.status}</span></td>
                </tr>`;
            }
        });

        updateCharts(barMap, stats);
    }

    function updateCharts(barMap, stats) {
        const total = stats.dentro + stats.fora;
        document.getElementById('kpiTotal').innerText = total;
        document.getElementById('kpiEficiencia').innerText = total > 0 ? ((stats.dentro / total) * 100).toFixed(1) + "%" : "0%";

        if (barChart) barChart.destroy();
        if (pieChart) pieChart.destroy();

        barChart = new Chart(document.getElementById('barChart'), {
            type: 'bar',
            data: {
                labels: Object.keys(barMap),
                datasets: [{ label: 'Viagens', data: Object.values(barMap), backgroundColor: '#1a1a2e' }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        pieChart = new Chart(document.getElementById('pieChart'), {
            type: 'pie',
            data: {
                labels: [
                    `Dentro do Prazo (${total > 0 ? ((stats.dentro/total)*100).toFixed(1) : 0}%)`,
                    `Fora do Prazo (${total > 0 ? ((stats.fora/total)*100).toFixed(1) : 0}%)`
                ],
                datasets: [{
                    data: [stats.dentro, stats.fora],
                    backgroundColor: ['#808080', '#e63946']
                }]
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                plugins: { title: { display: true, text: 'PONTUALIDADE (%)' } }
            }
        });
    }

    init();
</script>
</body>
</html>

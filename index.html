    <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Horse - Versão Final Corrigida</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #1a1a2e; --bg: #f4f7f6; --gray-status: #808080; --red-status: #e63946; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; }
        header { background: var(--primary); color: white; padding: 1rem; text-align: center; }
        .container { padding: 20px; max-width: 1300px; margin: auto; }
        
        .filter-card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 11px; font-weight: bold; color: #555; text-transform: uppercase; }
        select, input { padding: 8px; border-radius: 6px; border: 1px solid #ccc; min-width: 140px; }
        
        button { padding: 10px 25px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .card h3 { margin: 0; font-size: 16px; color: #333; }
        .card p { margin: 10px 0 0; font-size: 32px; font-weight: 800; color: var(--primary); }

        .charts-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; margin-bottom: 20px; }
        .chart-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); min-height: 400px; }

        .table-container { background: white; padding: 20px; border-radius: 12px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; background: #f8f9fa; border-bottom: 2px solid #eee; }
        td { padding: 10px; border-bottom: 1px solid #eee; font-size: 13px; }
        .badge { padding: 5px 10px; border-radius: 12px; color: white; font-weight: bold; font-size: 10px; }
        .bg-dentro { background: var(--gray-status); }
        .bg-fora { background: var(--red-status); }
    </style>
</head>
<body>

<header><h1>DASHBOARD LOGÍSTICO HORSE</h1></header>

<div class="container">
    <div class="filter-card">
        <div class="filter-group">
            <label>Fornecedor</label>
            <select id="fornSelect"><option value="ALL">TODOS</option></select>
        </div>
        <div class="filter-group">
            <label>Data Início</label>
            <input type="date" id="dtStart">
        </div>
        <div class="filter-group">
            <label>Data Fim</label>
            <input type="date" id="dtEnd">
        </div>
        <div class="filter-group">
            <label>Status Pontualidade</label>
            <select id="statusSelect">
                <option value="AMBOS">DENTRO + FORA</option>
                <option value="DENTRO">SOMENTE DENTRO</option>
                <option value="FORA">SOMENTE FORA</option>
            </select>
        </div>
        <button onclick="processData()">ATUALIZAR FILTROS</button>
    </div>

    <div class="stats-grid">
        <div class="card"><h3>Total Analisado</h3><p id="kpiTotal">0</p></div>
        <div class="card"><h3>Eficiência do Filtro</h3><p id="kpiEficiencia">0%</p></div>
    </div>

    <div class="charts-grid">
        <div class="chart-container"><canvas id="barChart"></canvas></div>
        <div class="chart-container"><canvas id="pieChart"></canvas></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>DATA</th>
                    <th>FORNECEDOR</th>
                    <th>ROTA</th>
                    <th>VIAGEM</th>
                    <th>STATUS</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSet_MSL2I0uUFX4Fwa_0WSIJAeOiyRC5eS_kXFGn0JEJqPKaIKPSPghTlSM0suGCZ_hZD-e_ZM-NEW/pub?gid=0&single=true&output=csv';
    let rawData = [];
    let barChart, pieChart;

    // Converte datas como "30-Apr" ou "14/05/2026" para o formato do navegador
    function parseAnyDate(dateStr) {
        if (!dateStr) return null;
        
        // Se já tiver barras (14/05/2026), inverte para ISO
        if (dateStr.includes('/')) {
            const p = dateStr.split('/');
            return `${p[2]}-${p[1]}-${p[0]}`;
        }

        // Se for formato hifenizado (30-Apr)
        const months = { 'Jan': '01', 'Feb': '02', 'Mar': '03', 'Apr': '04', 'May': '05', 'Jun': '06', 'Jul': '07', 'Aug': '08', 'Sep': '09', 'Oct': '10', 'Nov': '11', 'Dec': '12' };
        const parts = dateStr.split('-');
        if (parts.length < 2) return null;
        
        const day = parts[0].padStart(2, '0');
        const month = months[parts[1]] || '01';
        return `2026-${month}-${day}`; // Força 2026 como ano base
    }

    async function init() {
        const res = await fetch(URL);
        const csv = await res.text();
        const rows = csv.split('\n').slice(1);
        
        rawData = rows.map(r => {
            const c = r.split(',');
            return {
                dataOriginal: c[0]?.trim(),
                dataIso: parseAnyDate(c[0]?.trim()),
                forn: c[3]?.replace(/"/g, '').trim(),
                rota: c[4]?.trim(),
                viagem: c[6]?.trim(),
                status: c[9]?.replace(/"/g, '').trim().toUpperCase()
            };
        });

        const forns = [...new Set(rawData.map(d => d.forn))].filter(f => f).sort();
        const select = document.getElementById('fornSelect');
        forns.forEach(f => select.innerHTML += `<option value="${f}">${f}</option>`);

        processData();
    }

    function processData() {
        const selForn = document.getElementById('fornSelect').value;
        const selStatus = document.getElementById('statusSelect').value;
        const dStart = document.getElementById('dtStart').value;
        const dEnd = document.getElementById('dtEnd').value;

        let stats = { dentro: 0, fora: 0 };
        let barMap = {};
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";

        rawData.forEach(row => {
            const matchForn = selForn === "ALL" || row.forn === selForn;
            
            // Lógica de Data robusta
            let matchDate = true;
            if (dStart && dEnd && row.dataIso) {
                matchDate = (row.dataIso >= dStart && row.dataIso <= dEnd);
            }

            if (matchForn && matchDate) {
                const isDentro = row.status.includes("DENTRO") || row.status.includes("NO PRAZO");
                const isFora = row.status.includes("FORA") || row.status.includes("ATRASADO");

                // Filtro por categoria (Dentro ou Fora)
                const passStatusFilter = (selStatus === "AMBOS") || 
                                       (selStatus === "DENTRO" && isDentro) || 
                                       (selStatus === "FORA" && isFora);

                if ((isDentro || isFora) && passStatusFilter) {
                    if (isDentro) stats.dentro++;
                    if (isFora) stats.fora++;

                    const label = selForn === "ALL" ? row.forn : row.dataOriginal;
                    barMap[label] = (barMap[label] || 0) + 1;

                    tbody.innerHTML += `<tr>
                        <td>${row.dataOriginal}</td>
                        <td>${row.forn}</td>
                        <td>${row.rota}</td>
                        <td>${row.viagem}</td>
                        <td><span class="badge ${isDentro ? 'bg-dentro' : 'bg-fora'}">${row.status}</span></td>
                    </tr>`;
                }
            }
        });

        updateUI(barMap, stats, selStatus);
    }

    function updateUI(barMap, stats, filterMode) {
        const total = stats.dentro + stats.fora;
        document.getElementById('kpiTotal').innerText = total;

        // Eficiência baseada na seleção
        let efVal = 0;
        if (total > 0) {
            if (filterMode === "FORA") efVal = 0; // Se filtrou fora, a "eficiência" de estar no prazo é 0
            else if (filterMode === "DENTRO") efVal = 100; // Se filtrou dentro, é 100%
            else efVal = (stats.dentro / total) * 100;
        }
        document.getElementById('kpiEficiencia').innerText = efVal.toFixed(1) + "%";

        if (barChart) barChart.destroy();
        if (pieChart) pieChart.destroy();

        // Gráfico de Barras com as cores do filtro
        barChart = new Chart(document.getElementById('barChart'), {
            type: 'bar',
            data: {
                labels: Object.keys(barMap),
                datasets: [{ 
                    label: 'Viagens Filtradas', 
                    data: Object.values(barMap), 
                    backgroundColor: filterMode === "FORA" ? '#e63946' : (filterMode === "DENTRO" ? '#808080' : '#1a1a2e') 
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        // Gráfico de Pizza dinâmico
        pieChart = new Chart(document.getElementById('pieChart'), {
            type: 'pie',
            data: {
                labels: [`Dentro (${stats.dentro})`, `Fora (${stats.fora})`],
                datasets: [{ 
                    data: [stats.dentro, stats.fora], 
                    backgroundColor: ['#808080', '#e63946'] 
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Logístico - Horse</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #1a1a2e; --secondary: #16213e; --accent: #e63946; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; }
        header { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 20px; text-align: center; }
        .container { padding: 20px; max-width: 1200px; margin: auto; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        .card h3 { margin: 0; color: #666; font-size: 14px; }
        .card p { margin: 10px 0 0; font-size: 24px; font-weight: bold; color: var(--primary); }
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .chart-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); min-height: 300px; }
        @media (max-width: 768px) { .charts-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header>
    <h1>PAINEL DE CONTROLE DE COLETAS</h1>
    <p>Monitoramento Logístico em Tempo Real</p>
</header>

<div class="container">
    <div class="stats-grid">
        <div class="card"><h3>Total de Viagens</h3><p id="total-viagens">0</p></div>
        <div class="card"><h3>No Prazo</h3><p id="percentual-prazo">0%</p></div>
        <div class="card"><h3>Fornecedor Principal</h3><p id="forn-top">-</p></div>
    </div>
    <div class="charts-grid">
        <div class="chart-container"><canvas id="chartFornecedor"></canvas></div>
        <div class="chart-container"><canvas id="chartPrazo"></canvas></div>
    </div>
</div>

<script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSet_MSL2I0uUFX4Fwa_0WSIJAeOiyRC5eS_kXFGn0JEJqPKaIKPSPghTlSM0suGCZ_hZD-e_ZM-NEW/pub?gid=0&single=true&output=csv';

    async function loadData() {
        try {
            const response = await fetch(SHEET_URL);
            const data = await response.text();
            const rows = data.split('\n').map(r => r.trim()).filter(r => r.length > 0);
            const dataRows = rows.slice(1);

            let fornecedores = {};
            let noPrazo = 0;
            let total = 0;

            dataRows.forEach(row => {
                const cols = row.split(',');
                if (cols.length >= 11) {
                    total++;
                    const forn = cols[3].replace(/"/g, '').trim();
                    if (forn) fornecedores[forn] = (fornecedores[forn] || 0) + 1;
                    if (cols[10].includes("No Prazo")) noPrazo++;
                }
            });

            if (total > 0) updateDashboard(total, fornecedores, noPrazo);
        } catch (e) { console.error(e); }
    }

    function updateDashboard(total, fornecedores, noPrazo) {
        document.getElementById('total-viagens').innerText = total;
        document.getElementById('percentual-prazo').innerText = ((noPrazo/total)*100).toFixed(1) + "%";
        const topForn = Object.keys(fornecedores).reduce((a, b) => fornecedores[a] > fornecedores[b] ? a : b);
        document.getElementById('forn-top').innerText = topForn;

        new Chart(document.getElementById('chartFornecedor'), {
            type: 'bar',
            data: {
                labels: Object.keys(fornecedores),
                datasets: [{ label: 'Viagens', data: Object.values(fornecedores), backgroundColor: '#16213e' }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        new Chart(document.getElementById('chartPrazo'), {
            type: 'doughnut',
            data: {
                labels: ['No Prazo', 'Atrasado'],
                datasets: [{ data: [noPrazo, total - noPrazo], backgroundColor: ['#2ecc71', '#e63946'] }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    loadData();
</script>
</body>
</html>

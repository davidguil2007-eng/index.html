<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle de Coletas</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #1a1a2e; --bg: #f4f7f6; --gray-status: #808080; --red-status: #e63946; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; }
        header { background: var(--primary); color: white; padding: 1.5rem 1rem; text-align: center; }
        header h1 { margin: 0; font-size: 24px; letter-spacing: 1px; }
        header p { margin: 5px 0 0; font-size: 14px; opacity: 0.8; }
        .container { padding: 20px; max-width: 1300px; margin: auto; }
        
        .filter-card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 11px; font-weight: bold; color: #555; text-transform: uppercase; }
        select, input { padding: 8px; border-radius: 6px; border: 1px solid #ccc; min-width: 150px; height: 38px; box-sizing: border-box; }
        
        button { padding: 0 25px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; height: 38px; text-transform: uppercase; font-size: 12px; transition: background 0.2s; }
        button:hover { background: #252542; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .card h3 { margin: 0; font-size: 16px; color: #444; }
        .card p { margin: 10px 0 0; font-size: 36px; font-weight: 800; color: var(--primary); }

        .charts-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; margin-bottom: 20px; }
        .chart-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); min-height: 380px; position: relative; }

        .table-container { background: white; padding: 20px; border-radius: 12px; overflow-x: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; background: #f8f9fa; border-bottom: 2px solid #eee; font-size: 12px; color: #666; }
        td { padding: 10px; border-bottom: 1px solid #eee; font-size: 13px; color: #333; }
        .badge { padding: 5px 10px; border-radius: 12px; color: white; font-weight: bold; font-size: 10px; text-transform: uppercase; display: inline-block; }
        .bg-dentro { background: var(--gray-status); }
        .bg-fora { background: var(--red-status); }
    </style>
</head>
<body>

<header>
    <h1>PAINEL DE CONTROLE DE COLETAS</h1>
    <p>Monitoramento Logístico em Tempo Real</p>
</header>

<div class="container">
    <div class="filter-card">
        <div class="filter-group">
            <label>Fornecedor</label>
            <select id="fornSelect"><option value="ALL">TODOS</option></select>
        </div>
        <div class="filter-group">
            <label>Data Início</label>
            <input type="date" id="dtStart">
        </div>
        <div class="filter-group">
            <label>Data Fim</label>
            <input type="date" id="dtEnd">
        </div>
        <div class="filter-group">
            <label>Status Pontualidade</label>
            <select id="statusSelect">
                <option value="AMBOS">DENTRO + FORA</option>
                <option value="DENTRO">SOMENTE DENTRO DO PRAZO</option>
                <option value="FORA">SOMENTE FORA DO PRAZO</option>
            </select>
        </div>
        <button onclick="processData()">ATUALIZAR FILTROS</button>
    </div>

    <div class="stats-grid">
        <div class="card"><h3>Total Analisado</h3><p id="kpiTotal">0</p></div>
        <div class="card"><h3>Eficiência do Filtro</h3><p id="kpiEficiencia">0%</p></div>
    </div>

    <div class="charts-grid">
        <div class="chart-container"><canvas id="barChart"></canvas></div>
        <div class="chart-container"><canvas id="pieChart"></canvas></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>DATA</th>
                    <th>FORNECEDOR</th>
                    <th>ROTA</th>
                    <th>VIAGEM</th>
                    <th>STATUS</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSet_MSL2I0uUFX4Fwa_0WSIJAeOiyRC5eS_kXFGn0JEJqPKaIKPSPghTlSM0suGCZ_hZD-e_ZM-NEW/pub?gid=0&single=true&output=csv;
    let rawData = [];
    let barChartInstance = null;
    let pieChartInstance = null;

    function parseAnyDate(dateStr) {
        if (!dateStr) return null;
        
        if (dateStr.includes('/')) {
            const p = dateStr.split('/');
            return `${p[2]}-${p[1]}-${p[0]}`;
        }

        const months = { 'Jan': '01', 'Feb': '02', 'Mar': '03', 'Apr': '04', 'May': '05', 'Jun': '06', 'Jul': '07', 'Aug': '08', 'Sep': '09', 'Oct': '10', 'Nov': '11', 'Dec': '12' };
        const parts = dateStr.split('-');
        if (parts.length < 2) return null;
        
        const day = parts[0].padStart(2, '0');
        const month = months[parts[1]] || '01';
        return `2026-${month}-${day}`;
    }

    async function init() {
        try {
            const res = await fetch(URL);
            const csv = await res.text();
            const rows = csv.split('\n').slice(1);
            
            rawData = rows.map(r => {
                const c = r.split(',');
                return {
                    dataOriginal: c[0]?.trim(),
                    dataIso: parseAnyDate(c[0]?.trim()),
                    forn: c[3]?.replace(/"/g, '').trim(),
                    rota: c[4]?.trim(),
                    viagem: c[6]?.trim(),
                    status: c[9]?.replace(/"/g, '').trim().toUpperCase()
                };
            }).filter(item => item.forn && item.status);

            const forns = [...new Set(rawData.map(d => d.forn))].sort();
            const select = document.getElementById('fornSelect');
            forns.forEach(f => select.innerHTML += `<option value="${f}">${f}</option>`);

            processData();
        } catch (e) {
            console.error("Erro ao carregar dados da planilha:", e);
        }
    }

    function processData() {
        const selForn = document.getElementById('fornSelect').value;
        const selStatus = document.getElementById('statusSelect').value;
        const dStart = document.getElementById('dtStart').value;
        const dEnd = document.getElementById('dtEnd').value;

        let stats = { dentro: 0, fora: 0 };
        let barMap = {};
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";

        rawData.forEach(row => {
            if (row.status.includes("ANTECIPADO")) {
                return; 
            }

            const matchForn = selForn === "ALL" || row.forn === selForn;
            
            let matchDate = true;
            if (dStart && dEnd && row.dataIso) {
                matchDate = (row.dataIso >= dStart && row.dataIso <= dEnd);
            }

            if (matchForn && matchDate) {
                const isDentro = row.status.includes("DENTRO DO PRAZO") || row.status.includes("NO PRAZO") || row.status === "DENTRO";
                const isFora = row.status.includes("FORA DO PRAZO") || row.status.includes("ATRASADO") || row.status === "FORA";

                if (isDentro || isFora) {
                    const passStatus = (selStatus === "AMBOS") || 
                                       (selStatus === "DENTRO" && isDentro) || 
                                       (selStatus === "FORA" && isFora);

                    if (passStatus) {
                        if (isDentro) stats.dentro++;
                        if (isFora) stats.fora++;

                        const label = selForn === "ALL" ? row.forn : row.dataOriginal;
                        
                        // Inicializa a estrutura para permitir a separação de cores na barra
                        if (!barMap[label]) {
                            barMap[label] = { dentro: 0, fora: 0 };
                        }
                        if (isDentro) barMap[label].dentro++;
                        if (isFora) barMap[label].fora++;

                        tbody.innerHTML += `<tr>
                            <td>${row.dataOriginal}</td>
                            <td>${row.forn}</td>
                            <td>${row.rota}</td>
                            <td>${row.viagem}</td>
                            <td><span class="badge ${isDentro ? 'bg-dentro' : 'bg-fora'}">${row.status}</span></td>
                        </tr>`;
                    }
                }
            }
        });

        updateUI(barMap, stats, selStatus);
    }

    function updateUI(barMap, stats, filterMode) {
        const totalFiltro = stats.dentro + stats.fora;
        document.getElementById('kpiTotal').innerText = totalFiltro;

        let efVal = 0;
        if (totalFiltro > 0) {
            if (filterMode === "FORA") efVal = 0;
            else if (filterMode === "DENTRO") efVal = 100;
            else efVal = (stats.dentro / totalFiltro) * 100;
        }
        document.getElementById('kpiEficiencia').innerText = efVal.toFixed(1) + "%";

        if (barChartInstance) barChartInstance.destroy();
        if (pieChartInstance) pieChartInstance.destroy();

        // Configuração do Gráfico de Barras Empilhado com cores sincronizadas com a Pizza
        const ctxBar = document.getElementById('barChart').getContext('2d');
        const labels = Object.keys(barMap);
        const dataDentro = labels.map(l => barMap[l].dentro);
        const dataFora = labels.map(l => barMap[l].fora);

        barChartInstance = new Chart(ctxBar, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Dentro do Prazo',
                        data: dataDentro,
                        backgroundColor: '#808080' // Cinza
                    },
                    {
                        label: 'Fora do Prazo',
                        data: dataFora,
                        backgroundColor: '#e63946' // Vermelho
                    }
                ]
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                scales: {
                    x: { stacked: true },
                    y: { stacked: true, beginAtZero: true, ticks: { stepSize: 1 } }
                }
            }
        });

        // Configuração estrita do gráfico de pizza
        const ctxPie = document.getElementById('pieChart').getContext('2d');
        let pieLabels = [];
        let pieData = [];
        let pieColors = [];

        if (filterMode === "AMBOS" || filterMode === "DENTRO") {
            if(stats.dentro > 0 || filterMode === "DENTRO") {
                const pctDen = totalFiltro > 0 ? ((stats.dentro / totalFiltro) * 100).toFixed(1) : 0;
                pieLabels.push(`Dentro do Prazo: ${stats.dentro} (${pctDen}%)`);
                pieData.push(stats.dentro);
                pieColors.push('#808080'); 
            }
        }
        if (filterMode === "AMBOS" || filterMode === "FORA") {
            if(stats.fora > 0 || filterMode === "FORA") {
                const pctFora = totalFiltro > 0 ? ((stats.fora / totalFiltro) * 100).toFixed(1) : 0;
                pieLabels.push(`Fora do Prazo: ${stats.fora} (${pctFora}%)`);
                pieData.push(stats.fora);
                pieColors.push('#e63946'); 
            }
        }

        pieChartInstance = new Chart(ctxPie, {
            type: 'pie',
            data: {
                labels: pieLabels,
                datasets: [{
                    data: pieData,
                    backgroundColor: pieColors
                }]
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: true, position: 'top' }
                }
            }
        });
    }

    init();
</script>
</body>
</html>

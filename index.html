<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Logístico Horse - Correção de Porcentagem</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #1a1a2e; --bg: #f4f7f6; --gray-status: #808080; --red-status: #e63946; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; }
        header { background: var(--primary); color: white; padding: 1rem; text-align: center; }
        .container { padding: 20px; max-width: 1300px; margin: auto; }
        
        .filter-card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 11px; font-weight: bold; color: #555; text-transform: uppercase; }
        select, input { padding: 8px; border-radius: 6px; border: 1px solid #ccc; min-width: 140px; }
        
        button { padding: 10px 25px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .card h3 { margin: 0; font-size: 16px; color: #333; }
        .card p { margin: 10px 0 0; font-size: 32px; font-weight: 800; color: var(--primary); }

        .charts-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; margin-bottom: 20px; }
        .chart-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); min-height: 400px; position: relative; }

        .table-container { background: white; padding: 20px; border-radius: 12px; overflow-x: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; background: #f8f9fa; border-bottom: 2px solid #eee; }
        td { padding: 10px; border-bottom: 1px solid #eee; font-size: 13px; }
        .badge { padding: 5px 10px; border-radius: 12px; color: white; font-weight: bold; font-size: 10px; text-transform: uppercase; }
        .bg-dentro { background: var(--gray-status); }
        .bg-fora { background: var(--red-status); }
    </style>
</head>
<body>

<header><h1>PAINEL DE CONTROLE DE COLETAS</h1></header>

<div class="container">
    <div class="filter-card">
        <div class="filter-group">
            <label>Fornecedor</label>
            <select id="fornSelect"><option value="ALL">TODOS</option></select>
        </div>
        <div class="filter-group">
            <label>Data Início</label>
            <input type="date" id="dtStart">
        </div>
        <div class="filter-group">
            <label>Data Fim</label>
            <input type="date" id="dtEnd">
        </div>
        <div class="filter-group">
            <label>Status Pontualidade</label>
            <select id="statusSelect">
                <option value="AMBOS">DENTRO + FORA</option>
                <option value="DENTRO">SOMENTE DENTRO</option>
                <option value="FORA">SOMENTE FORA</option>
            </select>
        </div>
        <button onclick="processData()">ATUALIZAR FILTROS</button>
    </div>

    <div class="stats-grid">
        <div class="card"><h3>Total Analisado</h3><p id="kpiTotal">0</p></div>
        <div class="card"><h3>Eficiência do Filtro</h3><p id="kpiEficiencia">0%</p></div>
    </div>

    <div class="charts-grid">
        <div class="chart-container"><canvas id="barChart"></canvas></div>
        <div class="chart-container"><canvas id="pieChart"></canvas></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>DATA</th>
                    <th>FORNECEDOR</th>
                    <th>ROTA</th>
                    <th>VIAGEM</th>
                    <th>STATUS</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSet_MSL2I0uUFX4Fwa_0WSIJAeOiyRC5eS_kXFGn0JEJqPKaIKPSPghTlSM0suGCZ_hZD-e_ZM-NEW/pub?gid=0&single=true&output=csv';
    let rawData = [];
    let barChartInstance = null;
    let pieChartInstance = null;

    function parseAnyDate(dateStr) {
        if (!dateStr) return null;
        
        if (dateStr.includes('/')) {
            const p = dateStr.split('/');
            return `${p[2]}-${p[1]}-${p[0]}`;
        }

        const months = { 'Jan': '01', 'Feb': '02', 'Mar': '03', 'Apr': '04', 'May': '05', 'Jun': '06', 'Jul': '07', 'Aug': '08', 'Sep': '09', 'Oct': '10', 'Nov': '11', 'Dec': '12' };
        const parts = dateStr.split('-');
        if (parts.length < 2) return null;
        
        const day = parts[0].padStart(2, '0');
        const month = months[parts[1]] || '01';
        return `2026-${month}-${day}`;
    }

    async function init() {
        try {
            const res = await fetch(URL);
            const csv = await res.text();
            const rows = csv.split('\n').slice(1);
            
            rawData = rows.map(r => {
                const c = r.split(',');
                return {
                    dataOriginal: c[0]?.trim(),
                    dataIso: parseAnyDate(c[0]?.trim()),
                    forn: c[3]?.replace(/"/g, '').trim(),
                    rota: c[4]?.trim(),
                    viagem: c[6]?.trim(),
                    status: c[9]?.replace(/"/g, '').trim().toUpperCase()
                };
            }).filter(item => item.forn && item.status);

            const forns = [...new Set(rawData.map(d => d.forn))].sort();
            const select = document.getElementById('fornSelect');
            forns.forEach(f => select.innerHTML += `<option value="${f}">${f}</option>`);

            processData();
        } catch (e) {
            console.error("Erro ao carregar dados:", e);
        }
    }

    function processData() {
        const selForn = document.getElementById('fornSelect').value;
        const selStatus = document.getElementById('statusSelect').value;
        const dStart = document.getElementById('dtStart').
